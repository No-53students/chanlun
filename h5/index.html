<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>缠论可视化学习</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="vendor/vue.global.prod.js"></script>
  <script src="vendor/echarts.min.js"></script>
</head>
<body>
<div id="app" class="layout">
  <button class="nav-fab" v-show="!navOpen" @click="navOpen = true" aria-label="打开目录">☰</button>
  <div class="nav-backdrop" v-show="navOpen" @click="navOpen = false"></div>
  <aside class="sidebar" :class="{ collapsed: !navOpen }">
    <div class="brand">缠论可视化学习<small>按术语依赖顺序 · 自底向上</small></div>
    <button class="nav-toggle" @click="navOpen = !navOpen" :title="navOpen ? '收起目录' : '展开目录'">
      <span v-if="navOpen">收起目录 ‹</span><span v-else>☰</span>
    </button>
    <div class="search-box" v-if="navOpen">
      <input v-model="searchQuery" placeholder="搜索术语 / 章节" />
      <div class="search-results" v-if="searchQuery.trim()">
        <template v-if="searchTerms.length">
          <div class="sr-h">术语</div>
          <a v-for="g in searchTerms" :key="g.term" :href="'#/' + g.ch" @click="searchQuery = ''; closeNav()">{{ g.term }}<span class="sr-def">{{ g.def }}</span></a>
        </template>
        <template v-if="searchChapters.length">
          <div class="sr-h">章节</div>
          <a v-for="c in searchChapters" :key="c.id" :href="'#/' + c.id" @click="searchQuery = ''; closeNav()">{{ c.title }}</a>
        </template>
        <div class="sr-empty" v-if="!searchTerms.length && !searchChapters.length">无匹配</div>
      </div>
    </div>
    <ul class="nav">
      <template v-for="g in groupedChapters" :key="g.vol">
        <li class="grp">{{ g.vol }}</li>
        <li v-for="c in g.chapters" :class="{ active: c.id === cur.id }">
          <a :href="'#/' + c.id" @click="closeNav()">{{ c.title }}</a>
        </li>
      </template>
      <li class="grp">远期规划</li>
      <li class="disabled" v-for="t in upcoming"><a>{{ t }}</a></li>
    </ul>
  </aside>

  <main class="main">
    <div class="chapter-head">
      <h1>{{ cur.title }}</h1>
      <span class="src-badge">{{ cur.source }}</span>
    </div>

    <div class="content-grid">
      <!-- 左：主图 / 详图（详细标注） -->
      <div class="fig-panel">
        <template v-for="(f, i) in cur.figures" :key="i">
          <section class="block fig-card">
            <h2><span class="tag viz">主图{{ cur.figures.length > 1 ? (i + 1) : '' }}</span>{{ f.title }}</h2>
            <div v-if="f.kind === 'echarts'" :id="'fig' + i" class="chart-box"></div>
            <div v-else class="fig-html" v-html="f.html"></div>
            <p class="tip" v-html="f.note"></p>
          </section>
        </template>
        <section class="block fig-card" v-if="anim">
          <h2><span class="tag viz">演示</span>{{ anim.title }}</h2>
          <div class="stepper">
            <div class="stepper-stage" v-html="anim.steps[animStep].html"></div>
            <div class="stepper-bar">
              <button class="step-btn" @click="animStep = Math.max(0, animStep - 1)" :disabled="animStep === 0">← 上一步</button>
              <span class="stepper-ind">{{ animStep + 1 }} / {{ anim.steps.length }} · {{ anim.steps[animStep].label }}</span>
              <button class="step-btn" @click="animStep = Math.min(anim.steps.length - 1, animStep + 1)" :disabled="animStep === anim.steps.length - 1">下一步 →</button>
            </div>
          </div>
        </section>
      </div>

      <!-- 右：讲解 + 讲解内部小图解 -->
      <div class="text-panel">
        <template v-for="s in cur.sections" :key="s.title">
          <section class="block" v-if="s.type === 'definition'">
            <h2><span class="tag">定义</span>{{ s.title }}</h2>
            <div class="def-item" v-for="it in s.items" :key="it.term">
              <div class="term">{{ it.term }}</div>
              <p v-html="it.text"></p>
              <div class="formula" v-if="it.formula" v-html="it.formula"></div>
              <div class="mini-fig" v-if="it.fig" v-html="it.fig"></div>
            </div>
          </section>

          <section class="block" v-else-if="s.type === 'motivation'">
            <h2><span class="tag">动机</span>{{ s.title }}</h2>
            <p v-html="s.text"></p>
          </section>

          <section class="block" v-else-if="s.type === 'pitfalls'">
            <h2><span class="tag">误区</span>{{ s.title }}</h2>
            <ul class="pitfalls"><li v-for="(p,i) in s.items" :key="i" v-html="p"></li></ul>
          </section>

          <section class="block" v-else-if="s.type === 'exercises'">
            <h2><span class="tag">练习</span>{{ s.title }}</h2>
            <details v-for="(e,i) in s.items" :key="i">
              <summary>{{ e.q }}</summary>
              <div class="ans" v-html="e.a"></div>
            </details>
            <div class="quiz" v-if="quiz.length">
              <div class="quiz-h">选择题 · 点击选项判断对错</div>
              <div class="quiz-q" v-for="(q, qi) in quiz" :key="qi">
                <div class="quiz-text">{{ qi + 1 }}. {{ q.q }}</div>
                <div class="quiz-opts">
                  <button class="quiz-opt" v-for="(op, oi) in q.options" :key="oi"
                    :class="{ right: oi === q.answer && quizPicked[qi] != null, wrong: quizPicked[qi] === oi && oi !== q.answer }"
                    :disabled="quizPicked[qi] != null"
                    @click="pickQuiz(qi, oi)">{{ op }}</button>
                </div>
                <div class="quiz-explain" v-if="quizPicked[qi] != null" :class="{ ok: quizPicked[qi] === q.answer }">
                  <b>{{ quizPicked[qi] === q.answer ? '✓ 正确' : '✗ 错误' }}</b> {{ q.explain }}
                </div>
              </div>
            </div>
          </section>
        </template>
        <section class="block" v-if="original">
          <h2><span class="tag">原文</span>{{ original.title }}</h2>
          <div class="original-text" v-html="original.text"></div>
        </section>
      </div>
    </div>

    <div class="pager">
      <a v-if="prev" :href="'#/' + prev.id">← {{ prev.title }}</a>
      <span v-else></span>
      <a v-if="next" :href="'#/' + next.id">{{ next.title }} →</a>
    </div>
  </main>
</div>
